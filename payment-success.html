
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 완료 - NAME-TEC</title>
</head>
<body>
  <h1 id="result">결제를 확인하고 있습니다...</h1>
  <p id="message">잠시만 기다려 주세요.</p>

  <script>
    async function confirmPayment() {
      const result = document.getElementById("result");
      const message = document.getElementById("message");

      const params = new URLSearchParams(window.location.search);
      const paymentKey = params.get("paymentKey");
      const orderId = params.get("orderId");
      const amount = Number(params.get("amount"));
      const token = localStorage.getItem("nametec_token");

      if (!paymentKey || !orderId || !Number.isSafeInteger(amount) || amount <= 0 || !token) {
        result.textContent = "결제 확인 실패";
        message.textContent = "결제 정보 또는 로그인 정보를 확인할 수 없습니다.";
        return;
      }

      try {
        const response = await fetch(
          "https://name-tec-server.onrender.com/api/payments/confirm",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ paymentKey, orderId, amount })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "결제 승인에 실패했습니다.");
        }

        result.textContent = "결제가 완료되었습니다!";
        message.textContent =
          "프리미엄 이용권 " + data.creditsAdded + "회가 지급되었습니다.";

        window.history.replaceState({}, document.title, window.location.pathname);

      } catch (error) {
        console.error("결제 승인 오류:", error);
        result.textContent = "결제 확인이 필요합니다.";
        message.textContent = error.message;
      }
    }

    confirmPayment();
  </script>
</body>
</html>
