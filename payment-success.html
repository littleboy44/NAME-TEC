
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 완료 - NAME-TEC</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff8f0;
      font-family: Arial, sans-serif;
      color: #333;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 40px 24px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }

    h1 {
      color: #e98232;
      font-size: 26px;
    }

    p {
      line-height: 1.7;
      color: #666;
    }

    button {
      margin-top: 24px;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      background: #ed8735;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="result">결제를 확인하고 있습니다...</h1>
    <p id="message">잠시만 기다려 주세요.</p>
    <button id="homeButton" onclick="goHome()" style="display:none;">
      NAME-TEC 메인으로 돌아가기
    </button>
  </div>

  <script>
    const STORAGE_KEY = "nametec_payment_success";

    const result = document.getElementById("result");
    const message = document.getElementById("message");
    const homeButton = document.getElementById("homeButton");

    function showSuccess(data) {
      result.textContent = "결제가 완료되었습니다!";

      if (data.creditsAdded > 0) {
        message.textContent =
          "프리미엄 이용권 " + data.creditsAdded + "개가 지급되었습니다.";
      } else {
        message.textContent =
          "이미 처리된 결제입니다. 크레딧은 이전 요청에서 지급되었습니다.";
      }

      homeButton.style.display = "inline-block";
    }

    function goHome() {
      window.location.href = "./index.html";
    }

    async function confirmPayment() {
      const params = new URLSearchParams(window.location.search);

      const paymentKey = params.get("paymentKey");
      const orderId = params.get("orderId");
      const amount = Number(params.get("amount"));

      // 새로고침한 경우 기존 성공 결과 복원
      if (!paymentKey && !orderId) {
        const saved = sessionStorage.getItem(STORAGE_KEY);

        if (saved) {
          try {
            showSuccess(JSON.parse(saved));
            return;
          } catch (error) {
            sessionStorage.removeItem(STORAGE_KEY);
          }
        }

        result.textContent = "결제 정보를 확인할 수 없습니다.";
        message.textContent = "NAME-TEC으로 돌아가 다시 확인해 주세요.";
        homeButton.style.display = "inline-block";
        return;
      }

      const token = localStorage.getItem("nametec_token");

      if (
        !paymentKey ||
        !orderId ||
        !Number.isSafeInteger(amount) ||
        amount <= 0 ||
        !token
      ) {
        result.textContent = "결제 확인 실패";
        message.textContent =
          "결제 정보 또는 로그인 정보를 확인할 수 없습니다.";
        return;
      }

      try {
        const response = await fetch(
          "https://name-tec-server.onrender.com/api/payments/confirm",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + token
            },
            body: JSON.stringify({
              paymentKey,
              orderId,
              amount
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.message || "결제 승인에 실패했습니다."
          );
        }

        const successData = {
          creditsAdded: Number(data.creditsAdded) || 0,
          orderId
        };

        // 성공 결과를 현재 브라우저 탭에 저장
        sessionStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(successData)
        );

        // URL에서 결제 정보 제거
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

        showSuccess(successData);

      } catch (error) {
        console.error("결제 승인 오류:", error);
        result.textContent = "결제 확인이 필요합니다.";
        message.textContent = error.message;
      }
    }

    confirmPayment();
  </script>
</body>
</html>
